name: Refresh Market Breadth

# Separate from refresh-indicators.yml's 15-minute cron - a 50/200-day SMA
# breadth reading changes at most once a day (see market_breadth_data.py),
# so polling every 15 minutes would be pointless. Runs a few times a day
# instead so a single missed run doesn't delay picking up that day's price
# snapshot. Pushes straight to main (no PR review), same reasoning as
# refresh-etf-flow.yml: it only ever touches regenerated data/HTML.

on:
  schedule:
    - cron: "20 7,13,19,23 * * *"   # 4x/day, offset from refresh-etf-flow.yml's :15
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-market-breadth
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh market breadth data
        working-directory: scripts
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python refresh_market_breadth.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_breadth.json index.html market-breadth.html
          git diff --cached --quiet && exit 0
          git commit -m "Auto-refresh market breadth data [skip ci]"
          git pull --rebase origin main
          git push
