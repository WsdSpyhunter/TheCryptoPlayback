name: Weekly Playback

on:
  schedule:
    # Saturday (the weekend edition), 6:30 AM Central - same three-start
    # pattern and guard as daily.yml.
    - cron: "30 11 * * 6"
    - cron: "30 12 * * 6"
    - cron: "30 14 * * 6"
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write
  pull-requests: write
  actions: read   # lets the guard job look at today's earlier runs

jobs:
  # Decides whether this start should really generate an issue (see
  # scripts/should_run.py): not before 6:30 AM Central, and only if today's
  # issue hasn't already been made. Manual runs always go ahead.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: weekly.yml
        run: python scripts/should_run.py

  generate:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate this week's roundup (+ Buttondown draft)
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          REVIEW_EMAIL: scottdrealty@gmail.com
        run: python generate_weekly.py

      - name: Open a PR for review
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Weekly post: ${{ github.run_id }}"
          branch: "weekly-post-${{ github.run_number }}"
          title: "Weekly Playback draft — ready for review"
          body: "Auto-generated weekly roundup. A matching draft was also created in Buttondown. Review this PR, merge to publish the site post, then go send the Buttondown draft when you're ready."
