yaml
name: Weekly Playback

on:
  schedule:
    - cron: "0 11 * * 5"   # ~6:00 AM CST every Friday
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate this week's roundup (+ Buttondown draft)
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python generate_weekly.py

      - name: Open a PR for review
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Weekly post: ${{ github.run_id }}"
          branch: "weekly-post-${{ github.run_number }}"
          title: "Weekly Playback draft — ready for review"
          body: "Auto-generated weekly roundup. A matching draft was also created in Buttondown. Review this PR, merge to publish the site post, then go send the Buttondown draft when you're ready."
