name: Refresh institutional indicators

# Runs the four free-data institutional indicators every 2 hours and rebuilds
# institutional.html. Each indicator is isolated: a failing source marks only
# that indicator stale. No secrets are needed (public endpoints only).
on:
  schedule:
    - cron: "20 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-pro
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh indicators
        working-directory: scripts
        run: python -m pro.refresh_pro
      - name: Rebuild institutional page
        working-directory: scripts
        run: python pro_page.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pro/*.json institutional.html
          git diff --cached --quiet && exit 0
          git commit -m "Auto-refresh institutional indicators [skip ci]"
          git pull --rebase origin main
          git push
