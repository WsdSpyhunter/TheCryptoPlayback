name: Daily Playback

on:
  schedule:
    - cron: "0 11 * * *"   # ~6:00 AM CST every day
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's post
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python generate_daily.py

      - name: Open a PR for review
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Daily post: ${{ github.run_id }}"
          branch: "daily-post-${{ github.run_number }}"
          title: "Daily Playback draft — ready for review"
          body: "Auto-generated daily post. Review it in the Files changed tab, then merge to publish it live on the site."
